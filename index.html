<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>داشبورد مدیرعامل ستاوند</title>
  <meta name="description" content="داشبورد تصمیم‌سازی مدیرعامل یک هلدینگ ساختمانی ساختگی: ۱٫۱۹ میلیون ردیف داده، هفت مشکل، هفت اقدام با اثر برآوردی. همهٔ داده‌ها ساختگی‌اند.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    try { var t = localStorage.getItem("setavand-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="ناوبری اصلی">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <defs><linearGradient id="bm" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0071e3"/><stop offset=".6" stop-color="#5e5ce6"/><stop offset="1" stop-color="#b051d6"/></linearGradient></defs>
          <rect width="40" height="40" rx="11" fill="url(#bm)"/>
          <rect x="9" y="20" width="6" height="11" rx="2" fill="#fff" opacity=".7"/>
          <rect x="17" y="14" width="6" height="17" rx="2" fill="#fff" opacity=".85"/>
          <rect x="25" y="8" width="6" height="23" rx="2" fill="#fff"/>
        </svg>
        <div>
          <div class="brand-name">ستاوند</div>
          <div class="brand-sub">داشبورد مدیرعامل</div>
        </div>
      </div>
      <ul class="nav" id="nav"></ul>
      <div class="sidebar-foot">
        <div class="disclaimer">تمام نام‌ها، اعداد و رویدادهای این داشبورد ساختگی‌اند و برای نمایش روش تحلیل ساخته شده‌اند.</div>
        <div class="theme-toggle">
          <div class="seg" role="group" aria-label="حالت نمایش" id="theme-seg">
            <button type="button" data-theme-set="auto">خودکار</button>
            <button type="button" data-theme-set="light">روشن</button>
            <button type="button" data-theme-set="dark">تیره</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <div class="title-block">
            <p class="eyebrow" id="eyebrow">گروه سرمایه‌گذاری و ساختمانی ستاوند · گزارش پایان اسفند ۱۴۰۴</p>
            <h1 class="page-title" id="page-title">نمای کلی</h1>
          </div>
          <div class="filters" id="filters">
            <div class="seg" role="group" aria-label="دورهٔ زمانی" id="year-seg"></div>
            <label class="sr-only" for="sub-select">شرکت</label>
            <select class="select" id="sub-select"></select>
            <button class="icon-btn mobile-only" type="button" id="theme-mobile" aria-label="تغییر حالت روشن و تیره">
              <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
          </div>
        </div>
        <nav class="mobile-nav" id="mobile-nav" aria-label="صفحه‌ها"></nav>
      </header>

      <main class="content" id="view" tabindex="-1">
        <p class="lede">در حال بارگذاری داده‌ها…</p>
      </main>

      <footer class="footer">
        <div class="footer-card" id="footer"></div>
      </footer>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="btn" type="button" id="sheet-copy" hidden>رونوشت</button>
      <button class="icon-btn" type="button" id="sheet-close" aria-label="بستن">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script src="assets/js/model.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
